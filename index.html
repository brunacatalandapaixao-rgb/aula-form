<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula formulário</title>
</head>
<body>
    <h2>formulário aula 10-11</h2>
    <form>
        <label for="nomeCompleto">nome Completo:</label>
        <input type="text" id="nomeCompleto" placeholder="exemplo: Maria Antonieta" required></input>

        <label for="seuE-mail">seu E-mail: </label>
        <input type="email" id="seuE-mail" placeholder="exemplo: Maria.antonieta@email.com" required></input>
<p>

    <label for="senha">senha: </label>
    <input type="password" id="senha" required>
</p>

    <button type="submit" >Cadastrar</button>

    </form>
</body>
</html>
